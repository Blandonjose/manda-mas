<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600;700&display=block" rel="stylesheet">
<!-- One vertical slide (1080x1920) of an explainer Reel. make_explainer.py fills SLIDES and picks one with #n=N.
     Same look and safe area as reel.html. -->
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(circle at 105% 92%,rgba(47,111,214,.45) 0 300px,transparent 302px),radial-gradient(circle at -8% 4%,transparent 0 150px,rgba(255,255,255,.06) 151px 200px,transparent 201px),linear-gradient(165deg,#123a7a,#0b2a5b 55%,#081f45);color:#fff;font-family:"Inter",sans-serif;box-sizing:border-box;padding:230px 80px 0}
.slide{display:flex;flex-direction:column;justify-content:center;gap:36px;min-height:1250px}
.eyebrow{color:#ff8a1f;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:42px;letter-spacing:2px;text-transform:uppercase}
h1{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-2px}
h2{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:76px;line-height:1.06}
em{font-style:normal;color:#ff8a1f}
.body{font-size:52px;color:#c3d1ea;line-height:1.3}
.num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:220px;line-height:.9;color:#ff8a1f}
.cards{display:grid;gap:22px}
.card{background:rgba(255,255,255,.1);border-radius:28px;padding:30px 38px;display:grid;gap:8px}
.card.good{background:#fff;color:#0b2a5b}
.card .top{display:flex;justify-content:space-between;font-size:44px;font-weight:700}
.card .bot{display:flex;justify-content:space-between;align-items:baseline;font-size:36px;color:#c3d1ea}
.card.good .bot{color:#55627a}
.card b{font-family:"Bricolage Grotesque",sans-serif;font-size:64px}
.card.good b{color:#c2560a}
.small{font-size:32px;color:#9fb3d6;line-height:1.4}
.logo{display:flex;align-items:center;gap:22px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:96px}
.mark{width:120px;height:120px;border-radius:34px;background:#ff8a1f;color:#0b2a5b;display:grid;place-items:center;font-size:80px;transform:rotate(-6deg)}
.url{align-self:flex-start;font-weight:700;font-size:62px;background:#ff8a1f;color:#2a1400;padding:26px 46px;border-radius:999px}
.ticks{display:grid;gap:18px;font-size:50px;font-weight:700}
.tap{font-size:50px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:3px dashed #ff8a1f;border-radius:24px;padding:22px 30px;align-self:flex-start}

/* Over stock footage (#bg=1): transparent page, text on a dark card so it reads over any video. */
html.video,body.video{background:transparent}
body.video{padding:0 170px 440px 60px;display:flex;flex-direction:column;justify-content:flex-end}  /* card sits low (faces stay visible) and clear of the like/comment/share icons on the right and the caption at the bottom */
body.video .scene,body.video .slide{min-height:0;background:rgba(8,31,69,.84);border-radius:44px;padding:56px 60px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
</style></head><body><div class="slide" id="slide"></div>
<script>
const SLIDES = /*SLIDES*/[];
const n = +(location.hash.match(/n=(\d+)/) || [0, 0])[1];
document.getElementById("slide").innerHTML = SLIDES[n].html;
if (/bg=1/.test(location.hash)) { document.documentElement.classList.add("video"); document.body.classList.add("video"); }
</script></body></html>
